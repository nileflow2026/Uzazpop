services:
  - type: web
    name: uza-pap-pos
    runtime: python
    region: oregon

    # ── Build ──────────────────────────────────────────────────────────
    buildCommand: pip install -r requirements.txt

    # ── Start ──────────────────────────────────────────────────────────
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT

    # ── Environment variables ──────────────────────────────────────────
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: flex-pos-db
          property: connectionString

      - key: SECRET_KEY
        generateValue: true

      - key: DEBUG
        value: "false"

      # ── Self-registration flow ───────────────────────────────────────
      # AUTO_CREATE_FIRST_ADMIN=false so landing page signup (M-Pesa + auto-create)
      # is the only way to set up this pharmacy. No hardcoded admin.
      - key: AUTO_CREATE_FIRST_ADMIN
        value: "false"

      # ── App ──────────────────────────────────────────────────────────
      - key: ALLOWED_ORIGINS
        value: '["https://uzazpap.memeyai.com","https://uzazpop-by7v.onrender.com"]'

      - key: TRUSTED_HOSTS
        value: '["uzazpop-by7v.onrender.com"]'

      - key: APP_NAME
        value: "Uza Pap POS"

      - key: APP_VERSION
        value: "1.0.0"

      # ── M-Pesa ───────────────────────────────────────────────────────
      # ⚠ Set MPESA_CONSUMER_KEY, MPESA_CONSUMER_SECRET, and MPESA_PASSKEY
      #    manually in Render dashboard (they are marked sync: false)
      - key: MPESA_CONSUMER_KEY
        sync: false
      - key: MPESA_CONSUMER_SECRET
        sync: false
      - key: MPESA_SHORTCODE
        value: "174379"
      - key: MPESA_SHORTCODE_TYPE
        value: "till"
      - key: MPESA_PASSKEY
        sync: false
      - key: MPESA_CALLBACK_URL
        value: https://uzazpop-by7v.onrender.com/payments/mpesa/callback
      - key: MPESA_ENV
        value: sandbox

      # ── Optional ─────────────────────────────────────────────────────
      - key: OPENFDA_API_KEY
        value: ""
      - key: SMTP_HOST
        value: ""
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        value: ""
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM_EMAIL
        value: "no-reply@yourpharmacy.com"

databases:
  - name: flex-pos-db
    postgresMajorVersion: "18"
    plan: free
    region: oregon
