services:
  - type: web
    name: uza-pap-pos
    runtime: python
    region: oregon

    # ── Build ──────────────────────────────────────────────────────────
    buildCommand: pip install -r requirements.txt

    # ── Start ──────────────────────────────────────────────────────────
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT

    # ── Environment variables ──────────────────────────────────────────
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: flex-pos-db
          property: connectionString

      - key: SECRET_KEY
        generateValue: true

      - key: DEBUG
        value: "false"

      - key: AUTO_CREATE_FIRST_ADMIN
        value: "true"

      - key: FIRST_ADMIN_EMAIL
        value: admin@yourpharmacy.com

      - key: FIRST_ADMIN_NAME
        value: System Admin

      # ⚠ Set these manually in Render dashboard after deploy
      - key: FIRST_ADMIN_PASSWORD
        sync: false

      - key: ALLOWED_ORIGINS
        value: '["https://uza-pap-pos.onrender.com"]'

      - key: TRUSTED_HOSTS
        value: '["uza-pap-pos.onrender.com"]'

      - key: APP_NAME
        value: "Uza Pap POS"

      - key: APP_VERSION
        value: "1.0.0"

      # M-Pesa (sandbox defaults; set production values manually)
      - key: MPESA_CONSUMER_KEY
        sync: false

      - key: MPESA_CONSUMER_SECRET
        sync: false

      - key: MPESA_SHORTCODE
        value: "174379"

      - key: MPESA_PASSKEY
        sync: false

      - key: MPESA_CALLBACK_URL
        value: https://uza-pap-pos.onrender.com/payments/mpesa/callback

      - key: MPESA_ENV
        value: sandbox

      - key: OPENFDA_API_KEY
        value: ""

      # Email (optional — leave blank to log to console)
      - key: SMTP_HOST
        value: ""

      - key: SMTP_PORT
        value: "587"

      - key: SMTP_USER
        value: ""

      - key: SMTP_PASSWORD
        sync: false

      - key: SMTP_FROM_EMAIL
        value: "no-reply@yourpharmacy.com"

databases:
  - name: flex-pos-db
    plan: free
    region: oregon
